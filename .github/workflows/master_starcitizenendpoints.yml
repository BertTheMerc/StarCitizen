name: Build and deploy ASP.Net Core app to Azure Web App - StarCitizenEndPoints

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore ./PiStarEndPoints/PiStarEndpoints.csproj

      - name: Build
        run: dotnet build ./PiStarEndPoints/PiStarEndpoints.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./PiStarEndPoints/PiStarEndpoints.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'StarCitizenEndPoints'
          slot-name: 'Production'
          package: ./publish
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A195AEFA994045FE831C0631EB437311 }}
